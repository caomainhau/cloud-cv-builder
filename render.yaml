services:
  - type: web
    name: cloud-cv-builder
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: CloudCV Builder
      - key: APP_ENV
        value: production
      - key: SESSION_NAME
        value: cloudcv_session
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-cv-db
          property: connectionString

databases:
  - name: cloud-cv-db
    plan: free
    databaseName: cloudcv
    user: cloudcv
